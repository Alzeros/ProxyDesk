      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#141a4a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Rounded squircle base -->
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#topCyanGlow)"/>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#bottomDepth)"/>
  <rect x="13" y="13" width="230" height="230" rx="55" fill="none" stroke="url(#rimGrad)" stroke-width="2"/>

  <!-- Geometric P + separated node dot & proxy arrow -->
  <g filter="url(#softShadow)">
    <path fill="#ffffff" fill-rule="evenodd" d="
      M 66 70
      A 12 12 0 0 1 78 58
      L 143 58
      A 43 43 0 0 1 143 144
      L 92 144
      L 92 186
      A 13 13 0 0 1 66 186
      Z
      M 92 83
      L 92 119
      L 143 119
      A 18 18 0 0 0 143 83
      Z
    "/>
    <circle cx="114" cy="172" r="8" fill="#34d399"/>
    <path d="M 142 172 L 178 172 M 164 156 L 181 172 L 164 188"
          fill="none" stroke="url(#accentGrad)" stroke-width="13"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
