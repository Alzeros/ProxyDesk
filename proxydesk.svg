<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="12" y1="12" x2="244" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b6cf6"/>
      <stop offset="52%" stop-color="#5b57f6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="topCyanGlow" cx="0.78" cy="0.18" r="0.62">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottomDepth" cx="0.16" cy="0.88" r="0.62">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimGrad" x1="128" y1="12" x2="128" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.36"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="134" y1="172" x2="188" y2="172" gradientUnits="userSpaceOnUse">
